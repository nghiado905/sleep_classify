<!doctype html>
<html lang="vi">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duyệt nhãn sleep / raise_hand</title>
<style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;overflow:hidden;background:#0b111b;color:#edf2f9;font:15px system-ui}header{height:126px;padding:16px 22px;background:#172231;border-bottom:1px solid #334155}h1{font-size:21px;margin:0 0 6px}button,select,input{font:inherit;border:1px solid #475569;border-radius:7px;padding:9px 12px;background:#26354a;color:white}button{cursor:pointer}button:hover{background:#3b506c}button:disabled{opacity:.4;cursor:default}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:12px}.layout{height:calc(100vh - 126px);display:grid;grid-template-columns:430px minmax(0,1fr);gap:14px;padding:14px}.browser{min-height:0;display:flex;flex-direction:column;background:#141e2c;border:1px solid #29384c;border-radius:10px;padding:10px}.list{min-height:0;flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;gap:8px;padding:2px;scrollbar-gutter:stable}.item{min-width:0;height:132px;display:flex;flex-direction:column;gap:5px;padding:5px;text-align:left}.item img{width:100%;height:88px;object-fit:contain;background:#090d13;border-radius:4px}.item span{width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.item.active{outline:3px solid #38bdf8;background:#23435c}.pagebar{justify-content:center;margin-top:9px}.viewer{min-width:0;overflow-y:auto;padding-right:3px;scrollbar-gutter:stable}.panels{display:grid;grid-template-columns:minmax(180px,24%) minmax(0,1fr);gap:14px}.panel{background:#172231;border-radius:10px;padding:12px;min-width:0}.panel h2{font-size:14px;margin:0 0 10px;color:#a9bbd2}#crop{width:100%;height:330px;object-fit:contain}.canvas-wrap{height:min(58vh,590px);display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0b111b;border-radius:6px}#frame{display:block;max-width:100%;max-height:100%;width:auto;height:auto}.actions{position:sticky;bottom:0;z-index:2;display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;padding:10px;background:#172231;border:1px solid #334155;border-radius:9px}.danger{background:#842d3d}.sleep{background:#175e74}.raise{background:#675315}.muted{color:#a9bbd2;font-size:13px}#detail{overflow-wrap:anywhere;margin:11px 0}#message{min-height:24px;color:#7dd3fc}.error{color:#fda4af!important}#position{margin-left:auto}a{color:#7dd3fc}@media(max-width:950px){body{overflow:auto}header{height:auto}.layout{height:auto;grid-template-columns:1fr}.browser{height:330px}.list{grid-template-columns:repeat(5,minmax(0,1fr))}.viewer{overflow:visible}.panels{grid-template-columns:1fr}#crop{height:220px}.canvas-wrap{height:auto;max-height:60vh}.actions{position:static}}@media(max-width:600px){.list{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
<header><h1>Duyệt nhãn hành vi</h1><div id="stats" class="muted"></div>
<div class="toolbar"><select id="filter"><option value="">Tất cả</option><option>sleep</option><option>raise_hand</option></select><input id="search" placeholder="Tìm tên frame / crop"><button id="reload">Tải lại</button><button id="undo">Hoàn tác lần sửa cuối</button><span id="position"></span></div></header>
<main class="layout"><aside class="browser"><div id="list" class="list"></div><div class="toolbar pagebar"><button id="prevPage">Trang trước</button><span id="pageInfo"></span><button id="nextPage">Trang sau</button></div></aside>
<section class="viewer"><div class="panels"><div class="panel"><h2>Crop đang chọn</h2><img id="crop" alt="Crop"></div><div class="panel"><h2>Frame gốc · box đang chọn</h2><div class="canvas-wrap"><canvas id="frame"></canvas></div><a id="full" target="_blank" rel="noopener">Mở ảnh gốc kích thước đầy đủ</a></div></div>
<div id="detail"></div><div class="actions"><button id="prev">← Trước</button><button id="sleep" class="sleep">Sleep [S]</button><button id="raise_hand" class="raise">Raise hand [R]</button><button id="delete" class="danger">Xóa nhãn + crop [Delete]</button><button id="next">Tiếp →</button></div>
<p class="muted">Thao tác được lưu ngay. Xóa chỉ bỏ box đang chọn và crop tương ứng; frame gốc luôn được giữ lại. Đổi lớp sẽ chuyển crop sang thư mục lớp mới. Phím ← / → để duyệt, Ctrl+Z để hoàn tác.</p><div id="message" role="status"></div></section></main>
<script>
const $=id=>document.getElementById(id), token='__TOKEN__';
let data={items:[]},visible=[],pos=0,busy=false,generation=0,renderedPage=-1;const pageSize=30;
function msg(text,error=false){$('message').textContent=text;$('message').classList.toggle('error',error)}
async function api(path,body){let response=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':token},body:JSON.stringify(body)}:{});let result=await response.json();if(!response.ok)throw Error(result.error||'Lỗi máy chủ');return result}
function url(item,kind){return `/api/image?id=${item.id}&kind=${kind}&revision=${data.revision}`}
async function load(reset=false){data=await api('/api/items');applyFilter(reset)}
function applyFilter(reset=true){let term=$('search').value.toLowerCase();visible=data.items.filter(i=>(!$('filter').value||i.class_name===$('filter').value)&&i.name.toLowerCase().includes(term));if(reset){pos=0;renderedPage=-1}pos=Math.max(0,Math.min(pos,visible.length-1));render()}
function render(){
 const item=visible[pos],page=Math.floor(pos/pageSize),start=page*pageSize;
 const list=$('list'),oldScroll=list.scrollTop,samePage=page===renderedPage;
 $('stats').textContent=`${data.items.length} crop · sleep: ${data.counts?.sleep||0} · raise_hand: ${data.counts?.raise_hand||0}`;
 $('position').textContent=visible.length?`${pos+1} / ${visible.length}`:'Không có crop';list.replaceChildren();
 visible.slice(start,start+pageSize).forEach((row,j)=>{let b=document.createElement('button');b.className='item'+(start+j===pos?' active':'');b.title=row.name;let im=document.createElement('img');im.src=url(row,'crop');im.loading='lazy';let t=document.createElement('span');t.textContent=row.class_name+' · '+row.name;b.append(im,t);b.onclick=()=>{if(!busy){pos=start+j;render()}};list.append(b)});
 list.scrollTop=samePage?oldScroll:0;renderedPage=page;
 $('pageInfo').textContent=`${visible.length?page+1:0} / ${Math.ceil(visible.length/pageSize)}`;
 $('prevPage').disabled=busy||page===0;$('nextPage').disabled=busy||start+pageSize>=visible.length;
 $('prev').disabled=busy||pos===0;$('next').disabled=busy||pos>=visible.length-1;
 for(let a of ['sleep','raise_hand','delete'])$(a).disabled=busy||!item||a===item.class_name;
 $('undo').disabled=busy||!data.undo;$('reload').disabled=busy;$('filter').disabled=busy;$('search').disabled=busy;
 const seq=++generation,canvas=$('frame'),ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
 if(!item){$('crop').removeAttribute('src');$('detail').textContent='Không có crop trong bộ lọc này.';$('full').removeAttribute('href');return}
 $('crop').src=url(item,'crop');$('full').href=url(item,'image');$('detail').textContent=`${item.class_name} · confidence gốc: ${item.confidence} · ${item.frame}`;
 let image=new Image();image.onload=()=>{if(seq!==generation)return;canvas.width=image.width;canvas.height=image.height;ctx.drawImage(image,0,0);let [x,y,w,h]=item.box;ctx.lineWidth=Math.max(3,image.width/450);ctx.strokeStyle='#38f7ca';ctx.strokeRect((x-w/2)*image.width,(y-h/2)*image.height,w*image.width,h*image.height);ctx.font=`bold ${Math.max(18,image.width/65)}px sans-serif`;ctx.fillStyle='#38f7ca';ctx.fillText(item.class_name,Math.max(0,(x-w/2)*image.width),Math.max(25,(y-h/2)*image.height-9))};image.onerror=()=>{if(seq===generation)msg('Không tải được frame. Thử tải lại dữ liệu.',true)};image.src=url(item,'image');
}
async function action(name){if(busy||!visible[pos]&&name!=='undo')return;busy=true;const item=visible[pos];render();try{await api(name==='undo'?'/api/undo':'/api/edit',{id:item?.id,action:name,revision:data.revision});await load();msg(name==='undo'?'Đã hoàn tác.':name==='delete'?'Đã xóa box và crop. Frame gốc được giữ nguyên.':'Đã đổi lớp và chuyển crop.')}catch(e){msg(e.message,true)}finally{busy=false;render()}}
$('filter').onchange=()=>applyFilter();$('search').oninput=()=>applyFilter();$('reload').onclick=()=>load().catch(e=>msg(e.message,true));$('undo').onclick=()=>action('undo');
for(let a of ['sleep','raise_hand','delete'])$(a).onclick=()=>action(a);
function step(n){if(!busy){pos=Math.max(0,Math.min(visible.length-1,pos+n));render()}}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('prevPage').onclick=()=>step(-pageSize);$('nextPage').onclick=()=>step(pageSize);
document.addEventListener('keydown',e=>{if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)||busy)return;if(e.repeat)return;let key=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&key==='z'){e.preventDefault();action('undo')}else if(key==='arrowleft'){e.preventDefault();step(-1)}else if(key==='arrowright'){e.preventDefault();step(1)}else if(key==='s')action('sleep');else if(key==='r')action('raise_hand');else if(key==='delete'){e.preventDefault();action('delete')}});
load().catch(e=>msg(e.message,true));
</script></html>
